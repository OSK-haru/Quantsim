# Render Blueprint for the Yuragi-Strider FastAPI backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# NOTE: this project's live service (quantsim-vjul) was created via
# "New Web Service" rather than this Blueprint, so Render does not apply
# this file automatically — ALLOWED_ORIGINS and PUBLIC_MAX_LOGICAL_QUBITS
# must be set by hand under the service's Environment tab in the Render
# dashboard. This file documents the intended values and is what a fresh
# Blueprint-based deploy would use.
services:
  - type: web
    name: yuragi-strider-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://yuragi-strider-app.23sam55781.workers.dev
      - key: PUBLIC_MAX_LOGICAL_QUBITS
        value: "10"
    healthCheckPath: /api/health
