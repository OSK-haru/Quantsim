<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Yuragi-Strider system architecture</title>
  <desc id="desc">A three-layer quantum circuit simulator architecture.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#102a43" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5d73"/></marker>
    <style>.title{font:700 40px Arial,sans-serif;fill:#102a43}.sub{font:400 21px Arial,sans-serif;fill:#52616f}.head{font:700 26px Arial,sans-serif;fill:#102a43}.txt{font:400 19px Arial,sans-serif;fill:#334e68}.small{font:400 17px Arial,sans-serif;fill:#52616f}.white{font:700 19px Arial,sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="80" y="75" class="title">Yuragi-Strider | System Architecture</text>
  <text x="80" y="112" class="sub">An interactive, physically constrained quantum-circuit simulator</text>
  <rect x="80" y="155" width="1440" height="190" rx="22" fill="#e5f4ff" stroke="#b5d9f5"/>
  <rect x="104" y="180" width="205" height="43" rx="21" fill="#1976a8"/><text x="127" y="209" class="white">1. UI Layer</text>
  <g filter="url(#shadow)"><rect x="345" y="180" width="350" height="135" rx="16" fill="#fff"/><rect x="735" y="180" width="350" height="135" rx="16" fill="#fff"/><rect x="1125" y="180" width="350" height="135" rx="16" fill="#fff"/></g>
  <text x="385" y="221" class="head">Create circuits</text><text x="385" y="253" class="txt">Circuit Studio</text><text x="385" y="285" class="small">Place gates and set conditions</text>
  <text x="775" y="221" class="head">Set conditions</text><text x="775" y="253" class="txt">Simulation / Pulse Lab</text><text x="775" y="285" class="small">Temperature, field, and noise</text>
  <text x="1165" y="221" class="head">Understand results</text><text x="1165" y="253" class="txt">State Explorer</text><text x="1165" y="285" class="small">Probabilities and time evolution</text>
  <path d="M800 345 L800 397" stroke="#4b5d73" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="80" y="420" width="1440" height="170" rx="22" fill="#e8f8f0" stroke="#b6e4ce"/>
  <rect x="104" y="445" width="205" height="43" rx="21" fill="#16835a"/><text x="127" y="474" class="white">2. API Layer</text>
  <g filter="url(#shadow)"><rect x="345" y="445" width="480" height="115" rx="16" fill="#fff"/><rect x="875" y="445" width="600" height="115" rx="16" fill="#fff"/></g>
  <text x="385" y="487" class="head">FastAPI + Pydantic</text><text x="385" y="521" class="txt">/api/simulate and /api/pulse/simulate</text>
  <text x="915" y="487" class="head">Validation and orchestration</text><text x="915" y="521" class="txt">Validate inputs, select method, return JSON</text>
  <path d="M800 590 L800 642" stroke="#4b5d73" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="80" y="665" width="1440" height="170" rx="22" fill="#f1ecff" stroke="#d5c7ff"/>
  <rect x="104" y="690" width="205" height="43" rx="21" fill="#6c4db4"/><text x="127" y="719" class="white">3. Core Layer</text>
  <g filter="url(#shadow)"><rect x="345" y="690" width="340" height="115" rx="16" fill="#fff"/><rect x="725" y="690" width="340" height="115" rx="16" fill="#fff"/><rect x="1105" y="690" width="370" height="115" rx="16" fill="#fff"/></g>
  <text x="380" y="732" class="head">Python + NumPy</text><text x="380" y="766" class="txt">Density-matrix / statevector math</text>
  <text x="760" y="732" class="head">Physics models</text><text x="760" y="766" class="txt">Hamiltonian / Lindblad / CPTP</text>
  <text x="1140" y="732" class="head">Quality and extension</text><text x="1140" y="766" class="txt">Tests, QuTiP checks, optional Rust</text>
  <text x="80" y="875" class="small">QuTiP is used for independent validation; standard runs use the Python / NumPy core.</text>
</svg>
